<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%23050505'/><text x='50' y='64' font-size='38' font-family='Arial,sans-serif' font-weight='900' text-anchor='middle' fill='%23E2001A'>///M</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMW M SERIES — Built For The Unforgiving</title>
    <meta name="description" content="An interactive, cinematic tour of the BMW M line-up: M2, M3, M4, M5 and M8. Explore performance specs, design details and motorsport heritage." />

    <!-- Colour scheme: dark is the default; theme.tsx and the boot script below keep these in sync with the chosen theme. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: light)" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BMW M Series" />
    <meta property="og:title" content="BMW M SERIES — Built For The Unforgiving" />
    <meta property="og:description" content="An interactive, cinematic tour of the BMW M line-up: M2, M3, M4, M5 and M8. Explore performance specs, design details and motorsport heritage." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BMW M SERIES — Built For The Unforgiving" />
    <meta name="twitter:description" content="An interactive, cinematic tour of the BMW M line-up: M2, M3, M4, M5 and M8." />

    <!-- Paint the right canvas colour before the stylesheet (and the JS-injected CSS in dev) arrives. -->
    <style>
      html { background: #050505; color-scheme: dark; }
      html:not(.dark) { background: #f5f4f2; color-scheme: light; }
    </style>

    <!-- Google Fonts: Syne (display) · Outfit (body) · Space Grotesk (labels/data).
         Only the weights the site uses: Outfit 400-800, Syne 700-800, Space Grotesk 400-700.
         Each family is one variable woff2 file, so ranges cost no extra bytes. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..800&family=Syne:wght@700..800&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
    <script>
      // Runs before paint. Default theme is DARK for first-time visitors (we do
      // NOT follow prefers-color-scheme on purpose: the site is designed
      // dark-first). Returning visitors who chose light get it applied here,
      // together with the matching color-scheme / theme-color metas.
      (function () {
        try {
          if (localStorage.getItem('bmw-m-theme') === 'light') {
            document.documentElement.classList.remove('dark');
            var cs = document.querySelector('meta[name="color-scheme"]');
            if (cs) cs.setAttribute('content', 'light dark');
            var tc = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < tc.length; i++) tc[i].setAttribute('content', '#f5f4f2');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif;color:#f5f5f7;background:#050505">BMW M Series is an interactive experience and needs JavaScript enabled.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
